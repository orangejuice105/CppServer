<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title description">
  <title id="title">连接接入与 LT epoll 连接状态流程</title>
  <desc id="description">accept 成功后，连接数少于 1024 时设置非阻塞、登记 epoll 并保存连接，依次进入 Receiving、Sending 和 Draining，最后释放连接。容量已满时累计拒绝数并关闭新 fd。接收错误或无法构造超时响应，以及发送错误或超时，直接释放连接。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#526175"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", sans-serif; text-anchor: middle; fill: #1f2937; }
      .node { fill: #f5f3ff; stroke: #8b78c7; stroke-width: 1.5; }
      .state { fill: #eff6ff; stroke: #6694cf; stroke-width: 1.5; }
      .cleanup { fill: #f0fdf4; stroke: #6aa47d; stroke-width: 1.5; }
      .reject { fill: #fff7ed; stroke: #d49b55; stroke-width: 1.5; }
      .edge { fill: none; stroke: #526175; stroke-width: 1.5; marker-end: url(#arrow); }
      .label { font-size: 15px; }
      .name { font-size: 20px; font-weight: bold; }
      .detail { font-size: 17px; }
    </style>
  </defs>
  <rect width="720" height="980" rx="12" fill="#ffffff"/>

  <!-- Connection admission. Labels have explicit positions and ample margins. -->
  <rect class="node" x="230" y="24" width="260" height="56" rx="10"/>
  <text class="detail" x="360" y="59">accept 新连接</text>
  <path class="edge" d="M 360 80 V 104"/>

  <path class="node" d="M 360 104 L 462 174 L 360 244 L 258 174 Z"/>
  <text class="detail" x="360" y="169">受管理连接数</text>
  <text class="detail" x="360" y="194">小于 1024？</text>

  <path class="edge" d="M 462 174 H 550"/>
  <text class="label" x="507" y="160">否</text>
  <rect class="reject" x="550" y="140" width="154" height="68" rx="10"/>
  <text class="detail" x="627" y="168">累计容量拒绝数</text>
  <text class="detail" x="627" y="193">关闭新 fd</text>

  <path class="edge" d="M 360 244 V 292"/>
  <text class="label" x="379" y="274">是</text>
  <rect class="node" x="230" y="292" width="260" height="70" rx="10"/>
  <text class="detail" x="360" y="321">设置非阻塞</text>
  <text class="detail" x="360" y="348">登记 epoll 并保存连接</text>

  <!-- Connection states. Error paths share the cleanup destination. -->
  <path class="edge" d="M 360 362 V 418"/>
  <rect class="state" x="230" y="418" width="260" height="64" rx="10"/>
  <text class="name" x="360" y="445">Receiving</text>
  <text class="detail" x="360" y="470">接收请求头</text>

  <path class="edge" d="M 360 482 V 552"/>
  <rect x="305" y="502" width="110" height="26" fill="#ffffff"/>
  <text class="label" x="360" y="521">响应准备好</text>
  <rect class="state" x="230" y="552" width="260" height="64" rx="10"/>
  <text class="name" x="360" y="579">Sending</text>
  <text class="detail" x="360" y="604">发送响应</text>

  <path class="edge" d="M 360 616 V 702"/>
  <rect x="281" y="644" width="158" height="26" fill="#ffffff"/>
  <text class="label" x="360" y="663">响应全部交给内核</text>
  <rect class="state" x="230" y="702" width="260" height="64" rx="10"/>
  <text class="name" x="360" y="729">Draining</text>
  <text class="detail" x="360" y="754">有界清理剩余输入</text>

  <path class="edge" d="M 360 766 V 870"/>
  <rect x="274" y="802" width="172" height="26" fill="#ffffff"/>
  <text class="label" x="360" y="821">清理结束或达到预算</text>
  <rect class="cleanup" x="230" y="870" width="260" height="78" rx="10"/>
  <text class="detail" x="360" y="902">取消 epoll 登记</text>
  <text class="detail" x="360" y="930">关闭 fd，删除连接状态</text>

  <path class="edge" d="M 490 450 H 678 V 909 H 490"/>
  <rect x="509" y="461" width="155" height="50" fill="#ffffff"/>
  <text class="label" x="586" y="480">出错或无法构造</text>
  <text class="label" x="586" y="503">超时响应</text>

  <path class="edge" d="M 490 584 H 678"/>
  <text class="label" x="584" y="574">出错或发送超时</text>
</svg>
